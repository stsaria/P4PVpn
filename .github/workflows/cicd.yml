name: CI/CD Pipeline

on:
  push:
    branches:
      - d
    tags:
      - '[0-9]+.*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/stsaria/P4PCore.git@d
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest
  
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build "Nuitka[onefile]"
          pip install git+https://github.com/stsaria/P4PCore.git@d
          pip install .

      - name: Build Python package
        run: |
          python -m build

      - name: Build single-file binary
        run: |
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --output-filename=P4PVpn-linux-x86_64 \
            --remove-output \
            --include-package=P4PVpn \
            --include-distribution-metadata=P4PVpn \
            src/launcher.py
      
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*